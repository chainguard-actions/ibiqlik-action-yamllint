name: Test invalid YAML linting fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install yamllint
        run: pip install 'yamllint>=1.25.0'

      - id: action
        uses: .
        continue-on-error: true
        with:
          file_or_dir: tests/fixtures/invalid/bad.yaml
          config_data: |
            extends: default
            rules:
              line-length: disable
              indentation: disable
              trailing-spaces: disable

      - name: Assert linting failed on invalid YAML
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected linting to fail on invalid YAML, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: yamllint correctly failed on invalid YAML"
