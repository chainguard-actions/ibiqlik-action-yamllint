name: Test invalid YAML - expect failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install yamllint
        run: pip install yamllint
      - id: action
        uses: .
        continue-on-error: true
        with:
          file_or_dir: tests/fixtures/invalid.yaml
          format: parsable
      - name: Assert action failed on invalid YAML
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LOGFILE: ${{ steps.action.outputs.logfile }}
        run: |
          echo "outcome: $OUTCOME"
          echo "logfile: $LOGFILE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on invalid YAML, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid YAML"
