name: Test custom config_data inline configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install yamllint
        run: pip install 'yamllint>=1.25.0'

      - name: Verify file fails with default config (line-length enabled, strict)
        id: default-lint
        uses: .
        continue-on-error: true
        with:
          file_or_dir: tests/fixtures/longlines/long.yaml
          strict: "true"
          config_data: |
            extends: default

      - name: Assert default config fails on long lines in strict mode
        env:
          OUTCOME: ${{ steps.default-lint.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected default config to fail on long lines (strict mode), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: default config correctly flagged long lines"

      - name: Verify file passes with line-length disabled
        id: custom-lint
        uses: .
        with:
          file_or_dir: tests/fixtures/longlines/long.yaml
          config_data: |
            extends: default
            rules:
              line-length: disable

      - name: Assert custom config passes
        run: |
          echo "PASS: custom config with line-length disabled succeeded"
