name: Test strict mode - warnings become errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install yamllint
        run: pip install 'yamllint>=1.25.0'

      - id: action
        uses: .
        continue-on-error: true
        with:
          file_or_dir: tests/fixtures/nodocstart.yaml
          strict: "true"
          config_data: |
            extends: default
            rules:
              line-length: disable
              new-line-at-end-of-file: disable
              trailing-spaces: disable
              document-start:
                level: warning
          format: parsable

      - name: Assert action failed in strict mode due to warnings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail in strict mode when warnings are present, but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed in strict mode with warnings"
