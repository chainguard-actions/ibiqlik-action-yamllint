name: Test strict mode turns warnings into errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install yamllint
        run: pip install 'yamllint>=1.25.0'

      - name: Lint without strict mode - should succeed despite warnings
        id: action-no-strict
        uses: .
        with:
          file_or_dir: tests/fixtures/warnings/truthy-warn.yaml
          config_data: |
            extends: default
            rules:
              line-length: disable

      - name: Assert non-strict mode passes with warnings
        run: |
          echo "PASS: non-strict mode succeeded despite truthy warnings"

      - name: Lint with strict mode - should fail due to warnings
        id: action-strict
        uses: .
        continue-on-error: true
        with:
          file_or_dir: tests/fixtures/warnings/truthy-warn.yaml
          strict: "true"
          config_data: |
            extends: default
            rules:
              line-length: disable

      - name: Assert strict mode fails on warnings
        env:
          OUTCOME: ${{ steps.action-strict.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected strict mode to fail on warnings, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: strict mode correctly failed on warnings"
