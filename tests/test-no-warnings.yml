name: Test no_warnings mode suppresses warning output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install yamllint
        run: pip install 'yamllint>=1.25.0'

      - name: Lint with no_warnings=false (default) - should succeed, warnings shown
        id: with-warnings
        uses: .
        with:
          file_or_dir: tests/fixtures/warnings/truthy-warn.yaml
          no_warnings: "false"
          config_data: |
            extends: default
            rules:
              line-length: disable

      - name: Assert linting succeeded (warnings shown but no failure without strict)
        run: |
          echo "PASS: linting succeeded with warnings present (no strict mode)"

      - name: Lint with no_warnings=true - should also succeed (warnings suppressed)
        id: no-warnings
        uses: .
        with:
          file_or_dir: tests/fixtures/warnings/truthy-warn.yaml
          no_warnings: "true"
          config_data: |
            extends: default
            rules:
              line-length: disable

      - name: Assert linting succeeded with no_warnings enabled
        run: |
          echo "PASS: linting succeeded with no_warnings=true"
