name: Test no_warnings mode - suppress warnings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install yamllint
        run: pip install 'yamllint>=1.25.0'

      - id: action
        uses: .
        with:
          file_or_dir: tests/fixtures/nodocstart.yaml
          no_warnings: "true"
          config_data: |
            extends: default
            rules:
              line-length: disable
              new-line-at-end-of-file: disable
              trailing-spaces: disable
              document-start:
                level: warning
          format: parsable

      - name: Assert action succeeded with no_warnings mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LOGFILE: ${{ steps.action.outputs.logfile }}
        run: |
          echo "outcome: $OUTCOME"
          echo "logfile: $LOGFILE"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with no_warnings mode, but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action succeeded with no_warnings mode (warnings suppressed)"
