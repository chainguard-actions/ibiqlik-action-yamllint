name: Test Action
on: pull_request
permissions: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      - name: lint with config
        uses: ./
        with:
          file_or_dir: test
          config_data: |
            extends: default
            ignore: nok.yaml
            rules:
              new-line-at-end-of-file:
                level: warning
              trailing-spaces:
                level: warning

      - name: lint all - no warnings (continue on error)
        continue-on-error: true
        uses: ./
        with:
          file_or_dir: test
          strict: true
          no_warnings: true

      - name: lint all (continue on error)
        continue-on-error: true
        uses: ./
        with:
          file_or_dir: test
          strict: true
